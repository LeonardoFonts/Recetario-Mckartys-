<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Digital - Kitchen App</title>
    <!-- Tailwind CSS para un diseño limpio, moderno y responsivo estilo dark/clean -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
    
    <!-- Header principal -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 px-4 py-4 shadow-md">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold tracking-wider text-amber-500 uppercase">🍳 Recetario de Cocina v1.0</h1>
            <!-- Buscador en tiempo real -->
            <div class="w-full md:w-72">
                <input type="text" id="searchInput" placeholder="Buscar platillo, ingrediente..." 
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-amber-500 transition">
            </div>
        </div>
    </header>

    <!-- Contenedor de Categorías (Filtros rápidos) -->
    <nav class="max-w-4xl mx-auto px-4 py-4 flex gap-2 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all')" class="cat-btn bg-amber-600 text-white px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition">✨ Todos</button>
        <button onclick="filterCategory('Aderezos')" class="cat-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition">Salsas y Aderezos</button>
        <button onclick="filterCategory('Tenders')" class="cat-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition">Línea de Tenders</button>
        <button onclick="filterCategory('Burgers')" class="cat-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition">Burgers & Sándwiches</button>
        <button onclick="filterCategory('Hot Dogs')" class="cat-btn bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-4 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition">Hot Dogs</button>
    </nav>

    <!-- Listado Dinámico de Recetas -->
    <main class="max-w-4xl mx-auto px-4 pb-12">
        <div id="recipeContainer" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Las recetas se inyectan dinámicamente mediante JavaScript -->
        </div>
    </main>

    <!-- Script de lógica -->
    <script src="app.js"></script>
</body>
</html>
