<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recetario Digital Maestro - Kitchen App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans">
    
    <!-- Header / Portada Digital -->
    <header class="bg-gradient-to-r from-zinc-900 via-zinc-900 to-amber-950 border-b border-zinc-800 sticky top-0 z-50 px-4 py-6 shadow-xl">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="bg-amber-500/10 text-amber-400 text-xs px-2.5 py-1 rounded-full font-semibold border border-amber-500/20 uppercase tracking-wider">Free & Green / McCarthy's Pub</span>
                <h1 class="text-2xl font-black tracking-wider text-amber-500 mt-1 uppercase">🍳 Recetario de Cocina Maestro</h1>
            </div>
            <!-- Buscador en tiempo real -->
            <div class="w-full md:w-80">
                <input type="text" id="searchInput" placeholder="Buscar platillo, ingrediente, aderezo..." 
                    class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-amber-500 transition shadow-inner">
            </div>
        </div>
    </header>

    <!-- Contenedor de Categorías (Filtros interactivos con colores) -->
    <nav class="max-w-5xl mx-auto px-4 py-4 flex gap-2 overflow-x-auto no-scrollbar">
        <button onclick="filterCategory('all')" class="cat-btn bg-amber-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition shadow-md">✨ Todo el Recetario</button>
        <button onclick="filterCategory('Aderezos y Bases')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-zinc-800">🧂 Aderezos y Salsas</button>
        <button onclick="filterCategory('Tenders')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-zinc-800">🍗 Línea de Tenders</button>
        <button onclick="filterCategory('Burgers')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-zinc-800">🍔 Burgers & Sándwiches</button>
        <button onclick="filterCategory('Hot Dogs')" class="cat-btn bg-zinc-900 hover:bg-zinc-800 text-zinc-300 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition border border-zinc-800">🌭 Hot Dogs Especiales</button>
    </nav>

    <!-- Listado Dinámico de Recetas -->
    <main class="max-w-5xl mx-auto px-4 pb-16 pt-2">
        <div id="recipeContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Inyección de tarjetas mediante JavaScript -->
        </div>
    </main>

    <!-- Script de lógica con la base completa -->
    <script src="app.js"></script>
</body>
</html>
